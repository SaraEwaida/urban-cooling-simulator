[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-cooling-simulator"
version = "0.1.0"
description = "Physics-based simulation of street-level heat in a Phoenix neighbourhood and the cooling effect of trees, shade, cool roofs and porous paving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "zarr>=2.17",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "overturemaps>=0.10",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ucs = "ucs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
